name: CI/CD Pipeline - Practica DevOps

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Copiar el repositorio al runner
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Docker Buildx (soporte para builds avanzados y caché)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Autenticarse en Docker Hub usando los Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Construir y publicar la imagen de Laravel
      - name: Build and push Laravel Image
        uses: docker/build-push-action@v5
        with:
          context: ./laravel-api
          file: ./laravel-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agasaja-laravel:latest

      # 5. Construir y publicar la imagen de React
      - name: Build and push React Image
        uses: docker/build-push-action@v5
        with:
          context: ./reactfront
          file: ./reactfront/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agasaja-react:latest
