services:

  laravel:
    build:
      context: ./laravel-api
      dockerfile: Dockerfile

    container_name: agasaja-laravel

    ports:
      - "8000:80"

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  react:
    build:
      context: ./reactfront
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}

    container_name: agasaja-react

    ports:
      - "8080:80"

  mysql:
    image: mysql:8.4

    container_name: agasaja-mysql

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data:
